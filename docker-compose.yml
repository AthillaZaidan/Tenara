services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tenara
      POSTGRES_PASSWORD: tenara
      POSTGRES_DB: tenara
    ports:
      - "5432:5432"
    volumes:
      - tenara_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenara -d tenara"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tenara_pg:
