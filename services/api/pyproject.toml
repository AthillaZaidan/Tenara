[project]
name = "tenara-api"
version = "0.1.0"
description = "Tenara backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "fastembed>=0.9.1",
    "mediapipe>=1.2.2",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
]

[project.optional-dependencies]
body3d = [
    "smplx>=0.1.28",
    "torch>=2.15.0",
    "trimesh>=5.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
    "app.routers.ai.FormFile",
    "app.core.deps.require_role",
]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures imported from sibling test modules are used as parameters, which looks like a redefinition
"tests/*" = ["F811"]
